<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Baskelist · Agenda familiar</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"><script defer src="{{ url_for('static', filename='app.js') }}"></script></head><body>
<header><a class="brand" href="/">◉ <span>Baskelist<small>EL BÀSQUET, EN FAMÍLIA</small></span></a>{% if g.family %}<nav><a class="{{ 'active' if request.path=='/' }}" href="/">Agenda</a><a class="{{ 'active' if request.path=='/players' }}" href="/players">Jugadors</a></nav><form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="quiet">Sortir</button></form>{% else %}<span class="beta">PRIMERA VERSIÓ</span>{% endif %}</header>
<main>{% for message in get_flashed_messages() %}<div class="notice" role="status">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>Baskelist <span>Menys organització. Més bàsquet.</span></footer></body></html>
